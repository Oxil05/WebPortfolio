<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
</head>

<body style="margin: 0;">

    <Header style="text-align: center;background-color: aqua;padding: 10px;">
        <h1>Student Registration Form</h1>
    </Header>

    <nav style="background-color: pink;padding: 10px; display: flex; justify-content: center;gap: 50px;">

        <a href="CapisondaBSIT31A-Act3.html">Home</a>
        <a href="Registrationform.html">Registration Form</a>
        <a href="Gradetable.html">Grade Table</a>
        <a href="Myprofile.html">My Profile</a>
        
    </nav>

    <form style="background-color: goldenrod;padding: 10px;">

        Last Name: <input type="text" name="lastname"/>

        <br>
        <br>

        First Name: <input type="text" name="firstname">

        <br>
        <br>

        Gender: 

        <br>

        <input type="radio" name="Gender" id="Male"> Male
        <input type="radio" name="Gender" id="Female">Female

        <br>
        <br>

        Course:

        <br>

        <select name="dropdown">
            <option value="BSIT">BSIT</option>
            <option value="BSHM">BSHM</option>
            <option value="BECED">BECED</option>
            <option value="BSTM">BSTM</option>
            <option value="BSCS">BSCS</option>
            <option value="BSENTREP">BSENTREP</option>
            <option value="BSOA">BSOA</option>
            <option value="BTLED">BTLED</option>
        </select>

        <br>
        <br>

        Skills:

        <br>

        <input type="checkbox" name="Skills" id="HTML">HTML
        <input type="checkbox" name="Skills" id="CSS">CSS
        <input type="checkbox" name="Skills" id="Javascript">Javascript

        <br>
        <br>

        Upload Picture:

        <br>

        <input type="file" name="Picture" id="File">

        <br>
        <br>

        Address:

        <br>

        <textarea rows="5" cols="30" name="Address">
        </textarea>

        <br>
        <br>

        <input type="button" value="Submit">
        <input type="button" value="Reset">

    </form>

    <footer style="background-color: burlywood;padding: 10px;">
        <h2></h2>
            Copyrights Reserved 2026
        </h2>
    </footer>

</body>

</html>
