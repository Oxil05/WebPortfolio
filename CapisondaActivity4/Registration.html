<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="styling.css">

</head>

<body>
    
    <header>

        <div>

            <h1>
                My Personal Website    
            </h1>

            <p>
                Welcome to my Personal Student portal
            </p>

        </div>

    </header>

    <nav>

        <a href="Home.html">Home</a>
        <a href="Registration.html">Registration</a>
        <a href="Grades.html">Grades</a>
        <a href="Profile.html">Profile</a>
        
    </nav>

    <section class="regis">

        <div class="form">

            <h2>
                Student Registration Form
            </h2>

            <br>

            Student Name: <br>
            
            <input type="text" name="Fullname" placeholder="Enter your name"><br>

            Email:<br>

            <input type="text" name="email" placeholder="Enter your email"><br>

            Password:<br>

            <input type="password" name="password" placeholder="Enter your password"><br>

            Gender:<br><br>

            <input type="radio" name="gender" value="Male">Male
            <input type="radio" name="gender" value="Female">Female <br>
            <br>
            
            Course: <br>

            <select name="dropdown" id="">

                <option value="IT">BSIT</option>
                <option value="CS">BSCS</option>
                <option value="HM">BSHM</option>
                <option value="TM">BSTM</option>
                <option value="OA">BSOA</option>
                <option value="CED">BECED</option>
                <option value="TLED">BTLED</option>
                <option value="ENTREP">BSENTREP</option>

            </select><br><br>

            Skills: <br>

            <input type="checkbox" name="HTML">HTML
            <input type="checkbox" name="CSS">CSS
            <input type="checkbox" name="JAVASCRIPT">JAVASCRIPT <br> <br>

            Profile picture: <br>

            <input type="file" name="fileupload"><br><br>

            Address: <br>

            <textarea name="address" cols="30" placeholder="Enter address here"></textarea> <br><br>

            <input type="submit" value="Submit" class="butonton"><br><br>
            <input type="reset" value="Reset" class="butonton">

        </div>

    </section>

    <footer>
        
        <h3> All rights reserved</h3>

    </footer>

</body>

</html>
